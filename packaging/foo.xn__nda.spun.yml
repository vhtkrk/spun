# Flatpak manifest for spun. Build and install it from the repository root:
#
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-dir packaging/foo.xn__nda.spun.yml
#
# flatpak-cargo-generator.py comes from flatpak-builder-tools. Run it again
# after each change to Cargo.lock, because the build has no network.
id: foo.xn__nda.spun
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: spun
finish-args:
  - --share=network                            # WebSocket and mDNS
  - --socket=pulseaudio                        # audio, also on PipeWire
  - --env=PULSE_COOKIE=/app/share/spun/pulse-cookie  # see the build commands
  - --talk-name=org.kde.StatusNotifierWatcher  # tray
  - --talk-name=org.freedesktop.Notifications  # error notifications
  - --own-name=org.mpris.MediaPlayer2.spun     # media controls
  - --talk-name=org.mpris.MediaPlayer2.*       # other_media_action reads the state of each player
  - --talk-name=org.freedesktop.ScreenSaver    # tv_mode
  - --talk-name=org.gnome.SessionManager       # tv_mode on GNOME without the screensaver service
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/spun/cargo
modules:
  - name: spun
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/spun -t /app/bin
      - install -Dm644 packaging/foo.xn__nda.spun.desktop -t /app/share/applications
      - install -Dm644 packaging/foo.xn__nda.spun.metainfo.xml -t /app/share/metainfo
      - install -Dm644 packaging/foo.xn__nda.spun.png -t /app/share/icons/hicolor/256x256/apps
      # The PulseAudio client of cpal sends a cookie, and a server refuses a
      # client without one. The sandbox cannot read the user's cookie. Neither
      # PipeWire nor PulseAudio compares the content for a local client of the
      # same user, so 256 zero bytes do.
      - install -d /app/share/spun && head -c 256 /dev/zero > /app/share/spun/pulse-cookie
    sources:
      # Flathub needs a git source with a tag and a commit instead.
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - .flatpak-builder
      - cargo-sources.json

name: Rust

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msrd0/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev librsvg2-bin
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: dbus-run-session -- cargo test --locked tray::tests::dbus_tray_registers_updates_and_shuts_down -- --ignored --exact
      - run: dbus-run-session -- cargo test --locked other_media::tests::the_bus_signals_say_when_another_player_plays -- --ignored --exact
